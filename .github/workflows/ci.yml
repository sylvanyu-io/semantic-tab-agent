name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      full_gate:
        description: Run the real-extension stress gate
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  release-check:
    name: Release check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run standard release gate
        run: npm run release:check

      - name: Verify release tag and package version
        if: startsWith(github.ref, 'refs/tags/')
        run: REQUIRE_RELEASE_TAG=1 node scripts/verify-release-version.mjs

      - name: Upload public extension package
        uses: actions/upload-artifact@v7
        with:
          name: tab-recap-extension-package
          path: |
            dist/*.zip
            !dist/*-store*.zip
          if-no-files-found: error
          retention-days: 7

  extension-stress:
    name: Real extension stress
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.full_gate) }}
    needs: release-check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build local extension package
        run: npm run assets:icons && npm run build:extension

      - name: Run real-extension stress gate
        env:
          STRESS_GATEWAY: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
        run: xvfb-run --auto-servernum npm run stress:extension

      - name: Publish stress summary to job summary
        if: always()
        run: |
          if compgen -G "dist/stress/*.md" > /dev/null; then
            cat dist/stress/*.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No stress summary artifact was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload stress summary
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tab-recap-extension-stress
          path: dist/stress/*
          if-no-files-found: ignore
          retention-days: 7

  release-live-gateway:
    name: Live default gateway
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs:
      - release-check
      - extension-stress
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify live default AI service
        env:
          MONITOR_TOKEN: ${{ secrets.MONITOR_TOKEN }}
        run: node scripts/require-monitor-token.mjs && GATEWAY_REQUIRE_MONITOR=1 npm run smoke:gateway
