# Production Cloudflare Worker service name. Kept for deploy continuity after
# the product rename to TabRecap; do not rename unless migrating the Worker.
name = "tab-tidy-gateway"
main = "src/index.js"
compatibility_date = "2026-06-24"
workers_dev = false

routes = [
  { pattern = "cliproxy.sylvanyu.io/*", zone_name = "sylvanyu.io" }
]

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "a392f7d94e1e42aebe25f7725b43f9c4"

[[durable_objects.bindings]]
name = "RATE_LIMIT_DO"
class_name = "RateLimitCounter"

[[migrations]]
tag = "rate-limit-v1"
new_sqlite_classes = ["RateLimitCounter"]

[vars]
ALLOWED_MODELS = "glm-5.2,kimi-k3,deepseek-v4-pro,deepseek-v4-flash"
MAX_BODY_BYTES = "1000000"
MAX_UPSTREAM_RESPONSE_BYTES = "1000000"
MAX_TOKENS = "8192"
IP_HOURLY_REQUESTS = "20"
IP_DAILY_REQUESTS = "100"
IP_DAILY_PAGE_SUMMARY_REQUESTS = "20"
GLOBAL_DAILY_REQUESTS = "3000"
UPSTREAM_RETRY_ATTEMPTS = "2"
UPSTREAM_RETRY_DELAY_MS = "1200"
UPSTREAM_CHAT_TIMEOUT_MS = "300000"
UPSTREAM_READY_TIMEOUT_MS = "8000"
LLM_READY_MODEL = "deepseek-v4-flash"
LLM_READY_MAX_TOKENS = "2"
LLM_READY_TIMEOUT_MS = "45000"
ALERT_TO = "me@sylvanyu.io"
ALERT_FROM = "TabRecap Monitor <alerts@sylvanyu.io>"
MONITOR_REMINDER_HOURS = "6"

[triggers]
crons = ["*/30 * * * *"]
